[project]
name = "landpromo"
version = "0.1.0"
description = "Internal tools for a land promotion venture: site economics, constraint screening, settlement shortlist"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.4", "pydantic>=2", "requests>=2.31", "shapely>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
landpromo = "landpromo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
